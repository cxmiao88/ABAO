# ABao 定制 nginx http.conf（Coolify 容器内 /etc/nginx/site-opts.d/http.conf）
# 由 install.sh 在安装时写入容器；保留 Coolify 原生健康检查，其余路径统一交给 ABao SPA

listen 8080 default_server;
listen [::]:8080 default_server;

root /var/www/html/public;

# Set allowed "index" files
index index.html index.htm index.php;

server_name _;

charset utf-8;

# Set max upload to 2048M
client_max_body_size 2048M;

# Set client body buffer to handle Sentinel payloads in memory
client_body_buffer_size 256k;

# Healthchecks: Set /healthcheck to be the healthcheck URL
location /healthcheck {
    access_log off;

    # set max 5 seconds for healthcheck
    fastcgi_read_timeout 5s;

    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

# ================= ABao 定制（阶段 4/5） =================
# mdserver-web JSON API 反向代理（cookie 透传；生产入口 8000 统一对外）
location ~ ^/(do_login|check_login|verify_login|crontab|database|docker|files|firewall|ftp|logs|monitor|plugins|process|service|setting|site|soft|system|task|waf|api_tokens)(/|$) {
    proxy_pass http://host.docker.internal:48700;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# ABao 新前端静态资源（Vite build，base=/abao/）
location /abao/ {
    alias /var/www/html/public/abao/;
    index index.html;
    try_files $uri /abao/index.html;
}

# Coolify 后端 JSON API 走 Laravel（PHP）
location /panel-api/ {
    try_files $uri /index.php?$query_string;
}

# 其余全部路径（含 Coolify 旧前端 /login /dashboard 等）→ 新前端 SPA（hash 路由）
location / {
    try_files $uri /abao/index.html;
}

# Pass "*.php" files to PHP-FPM
location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 99;
}

# O1 终端握手认证端点（WS 服务器 127.0.0.1:8080 内部 POST；页面仍由 SPA 接管）
location = /terminal/auth {
    try_files $uri /index.php?$query_string;
}
location = /terminal/auth/ips {
    try_files $uri /index.php?$query_string;
}
location = /terminal/session {
    try_files $uri /index.php?$query_string;
}
