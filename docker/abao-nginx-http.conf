# ABao 定制 nginx http.conf（Coolify 容器内 /etc/nginx/site-opts.d/http.conf）
# 由 install.sh 在安装时写入容器；随机码入口隐藏面板，其余路径 404
# 占位符 __ABAO_ENTRY__ 由 install.sh 替换为安装时生成的随机码

listen 8080 default_server;
listen [::]:8080 default_server;

root /var/www/html/public;

index index.html index.htm index.php;

server_name _;

charset utf-8;

client_max_body_size 2048M;
client_body_buffer_size 256k;

location /healthcheck {
    access_log off;
    fastcgi_read_timeout 5s;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

# ================= ABao 定制 =================
# mdserver-web JSON API 反向代理（cookie 透传；生产入口 8000 统一对外）
location ~ ^/(do_login|check_login|verify_login|crontab|database|docker|files|firewall|ftp|logs|monitor|plugins|process|service|setting|site|soft|system|task|waf|api_tokens)(/|$) {
    proxy_pass http://host.docker.internal:48700;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# ABao 随机码入口（隐藏面板入口，像宝塔安全入口；访问 /随机码 直达面板）
location = /__ABAO_ENTRY__ {
    default_type text/html; # 无扩展名路径按 HTML 渲染，避免浏览器下载 index.html
    add_header Cache-Control "no-store"; # 防浏览器缓存旧的下载决策
    add_header Content-Disposition "inline"; # 强制内联渲染，杜绝下载
    alias /var/www/html/public/abao/index.html;
}

# phpMyAdmin 统一入口（宿主 nginx 888，经 8000 反代，免开额外安全组端口）
# 用 ^~ 前缀（优先于下方 location ~ \.php$ 正则），否则 /phpmyadmin/index.php 会被 PHP 正则拦截返回 SPA/404
location ^~ /phpmyadmin/ {
    proxy_pass http://host.docker.internal:888/phpmyadmin_sjqemi/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    # cookie path 重写：phpMyAdmin 设置 path=/phpmyadmin_sjqemi/，但浏览器访问 /phpmyadmin/ 不匹配，会话/CSRF token 全丢
    # 改写为 /phpmyadmin/ 后浏览器才会保存并回传 cookie，建库/管理操作才不被拒绝
    proxy_cookie_path /phpmyadmin_sjqemi/ /phpmyadmin/;
}

# mdserver 静态资源（插件宿主页 /static/app/plugin-host.html 及插件页面 css/js 依赖）
location /static/ {
    add_header Cache-Control "no-store";
    proxy_pass http://host.docker.internal:48700;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ABao 新前端静态资源（Vite build，base=/abao/；仅资源放行，入口隐藏）
location /abao/ {
    alias /var/www/html/public/abao/;
    try_files $uri =404;
}

# 隐藏原入口页（直接访问 /abao/ 或 /abao/index.html 一律 403）
location = /abao/ { return 403; }
location = /abao/index.html { return 403; }

# Coolify 后端 JSON API 走 Laravel（PHP）
location /panel-api/ {
    try_files $uri /index.php?$query_string;
}

# 其余全部隐藏（含 Coolify 旧前端 /login /dashboard 等）
location / {
    return 404;
}

# Pass "*.php" files to PHP-FPM
location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 99;
}

# O1 终端握手认证端点（WS 服务器 127.0.0.1:8080 内部 POST；页面仍由 SPA 接管）
location = /terminal/auth {
    try_files $uri /index.php?$query_string;
}
location = /terminal/auth/ips {
    try_files $uri /index.php?$query_string;
}
location = /terminal/session {
    try_files $uri /index.php?$query_string;
}
