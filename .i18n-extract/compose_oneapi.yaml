services:
  one-api:
    image: justsong/one-api:latest
    environment:
      - SERVICE_FQDN_ONEAPI_3000
      - 'TZ=${TZ:-UTC}'
    volumes:
      - one-api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c ':> /dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  one-api-data:
